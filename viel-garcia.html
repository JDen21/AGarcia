<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viel Garcia - Space</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        montserrat: ['Montserrat', 'sans-serif'],
                    },
                    colors: {
                        brandDark: '#0b0f19',
                        brandCard: '#111827',
                        brandRed: '#e11d48',
                        brandBlue: '#38bdf8',
                    }
                }
            }
        }
    </script>
    <style>
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            opacity: 0.6;
        }

        .reveal-up {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s cubic-bezier(0.215, 0.61, 0.355, 1), transform 0.8s cubic-bezier(0.215, 0.61, 0.355, 1);
        }

        .reveal-active {
            opacity: 1;
            transform: translateY(0);
        }

        .delay-100 { transition-delay: 100ms; }
    </style>
</head>

<body class="bg-brandDark text-gray-100 font-sans antialiased selection:bg-brandBlue selection:text-white flex flex-col min-h-screen">

    <!-- Navigation -->
    <header class="sticky top-0 z-50 bg-brandDark/80 backdrop-blur-md border-b border-gray-800/60 transition-all duration-300">
        <div class="max-w-6xl mx-auto px-6 py-5 flex items-center justify-between relative">
            <a href="index.html" class="font-montserrat text-xl font-[800] uppercase tracking-wider text-gray-100 z-50">
                A. Garcia <span class="text-brandRed">Family</span>
            </a>
            
            <!-- Desktop Navigation Links -->
            <nav class="hidden md:flex space-x-8">
                <a href="index.html" class="text-sm font-[500] text-gray-400 hover:text-white transition-colors duration-300">Home</a>
                <a href="den-garcia.html" class="text-sm font-[500] text-gray-400 hover:text-white transition-colors duration-300">Den Garcia</a>
                <a href="kris-garcia.html" class="text-sm font-[500] text-gray-400 hover:text-brandRed transition-colors duration-300">Kris Garcia</a>
                <a href="viel-garcia.html" class="text-sm font-[500] text-brandBlue transition-colors duration-300">Viel Garcia</a>
            </nav>

            <!-- Mobile Hamburger Button -->
            <button id="menu-btn" class="block md:hidden text-gray-400 hover:text-white focus:outline-none z-50" aria-label="Toggle Menu">
                <svg id="hamburger-icon" class="w-6 h-6 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>

            <!-- Mobile Dropdown Menu -->
            <div id="mobile-menu" class="absolute top-full left-0 w-full bg-brandDark/95 backdrop-blur-lg border-b border-gray-800/80 flex flex-col space-y-4 px-6 py-6 transition-all duration-300 transform -translate-y-10 opacity-0 pointer-events-none md:hidden">
                <a href="index.html" class="text-base font-[500] text-gray-300 hover:text-white transition-colors">Home</a>
                <a href="den-garcia.html" class="text-base font-[500] text-gray-300 hover:text-white transition-colors">Den Garcia</a>
                <a href="kris-garcia.html" class="text-base font-[500] text-gray-300 hover:text-brandRed transition-colors">Kris Garcia</a>
                <a href="viel-garcia.html" class="text-base font-[500] text-brandBlue transition-colors">Viel Garcia</a>
            </div>
        </div>
    </header>

    <!-- Main Content Section -->
    <main class="relative flex-grow flex items-center justify-center overflow-hidden bg-brandDark py-20">
        <div id="canvas-container"></div>
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full max-w-5xl h-[500px] bg-gradient-to-tr from-brandBlue/10 via-indigo-500/5 to-transparent blur-3xl pointer-events-none rounded-full z-0"></div>

        <section class="max-w-3xl mx-auto px-6 relative z-10 text-center">
            <div class="reveal-up bg-brandCard/40 backdrop-blur-md border border-gray-800 rounded-2xl p-10 sm:p-16 shadow-2xl space-y-6">
                <div class="w-20 h-20 rounded-full bg-gray-900 border border-brandBlue/40 mx-auto flex items-center justify-center font-montserrat font-[700] text-brandBlue text-2xl mb-2">
                    VG
                </div>
                
                <h1 class="font-montserrat text-3xl sm:text-4xl font-[800] text-gray-100 tracking-tight">
                    Viel Garcia
                </h1>

                <div class="w-12 h-1 bg-brandBlue rounded-full mx-auto"></div>

                <p class="reveal-up delay-100 text-lg sm:text-xl text-gray-300 font-[400] leading-relaxed">
                    Raviel's space for when he's ready
                </p>

                <div class="pt-4">
                    <a href="index.html" class="inline-flex items-center gap-2 text-xs font-[600] tracking-wider uppercase text-gray-300 hover:text-white bg-gray-900/80 hover:bg-gray-800 px-5 py-3 rounded-lg border border-gray-800 transition-all duration-300">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                        Back to Home

                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="bg-[#060910] py-12 border-t border-gray-900 text-center text-sm text-gray-500 relative z-10">
        <div class="max-w-6xl mx-auto px-6 space-y-2">
            <p>&copy; 2026 A. Garcia Family Memorabilia. Built with gratitude.</p>
            <p class="text-xs text-gray-600">&copy; All rights reserved.</p>
        </div>
    </footer>

    <!-- Three.js Ambient Particle System -->
    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const particlesCount = window.innerWidth < 768 ? 300 : 700;
        const positions = new Float32Array(particlesCount * 3);
        const colors = new Float32Array(particlesCount * 3);
        const colorPalette = [new THREE.Color('#38bdf8'), new THREE.Color('#4f46e5')];

        for(let i = 0; i < particlesCount * 3; i+=3) {
            positions[i] = (Math.random() - 0.5) * 12;
            positions[i+1] = (Math.random() - 0.5) * 8;
            positions[i+2] = (Math.random() - 0.5) * 5;
            const mixedColor = colorPalette[Math.floor(Math.random() * colorPalette.length)];
            colors[i] = mixedColor.r;
            colors[i+1] = mixedColor.g;
            colors[i+2] = mixedColor.b;
        }

        const particlesGeometry = new THREE.BufferGeometry();
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        particlesGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const particlesMaterial = new THREE.PointsMaterial({
            size: 0.035,
            vertexColors: true,
            transparent: true,
            opacity: 0.7,
            blending: THREE.AdditiveBlending
        });

        const particleMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particleMesh);
        camera.position.z = 4;

        let mouseX = 0, mouseY = 0;
        window.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth) - 0.5;
            mouseY = (e.clientY / window.innerHeight) - 0.5;
        });

        const clock = new THREE.Clock();
        const animate = () => {
            const elapsedTime = clock.getElapsedTime();
            particleMesh.rotation.y = elapsedTime * 0.03;
            particleMesh.rotation.x = elapsedTime * 0.015;
            particleMesh.position.x += (mouseX * 0.5 - particleMesh.position.x) * 0.05;
            particleMesh.position.y += (-mouseY * 0.5 - particleMesh.position.y) * 0.05;
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        };
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });
    </script>

    <!-- Navigation & Scroll Observer -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const menuBtn = document.getElementById('menu-btn');
            const mobileMenu = document.getElementById('mobile-menu');
            const hamburgerIcon = document.getElementById('hamburger-icon');

            menuBtn.addEventListener('click', () => {
                const isOpen = mobileMenu.classList.contains('opacity-100');
                if (!isOpen) {
                    mobileMenu.classList.remove('opacity-0', 'pointer-events-none', '-translate-y-10');
                    mobileMenu.classList.add('opacity-100', 'pointer-events-auto', 'translate-y-0');
                    hamburgerIcon.style.transform = 'rotate(90deg)';
                    hamburgerIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>`;
                } else {
                    mobileMenu.classList.remove('opacity-100', 'pointer-events-auto', 'translate-y-0');
                    mobileMenu.classList.add('opacity-0', 'pointer-events-none', '-translate-y-10');
                    hamburgerIcon.style.transform = 'rotate(0deg)';
                    hamburgerIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>`;
                }
            });

            const observerOptions = { root: null, rootMargin: '0px', threshold: 0.12 };
            const observer = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('reveal-active');
                        observer.unobserve(entry.target);
                    }
                });
            }, observerOptions);

            document.querySelectorAll('.reveal-up').forEach(el => observer.observe(el));
        });
    </script>
</body>

</html>
