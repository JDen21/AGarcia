<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kris Garcia | A. Garcia Family</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap"
        rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        montserrat: ['Montserrat', 'sans-serif'],
                    },
                    colors: {
                        brandDark: '#0b0f19',
                        brandCard: '#111827',
                    }
                }
            }
        }
    </script>
</head>

<body
    class="bg-brandDark text-gray-100 font-sans antialiased selection:bg-white selection:text-black overflow-x-hidden">

    <!-- Header Navigation -->
    <header class="sticky top-0 z-50 bg-brandDark/90 backdrop-blur-md border-b border-gray-800">
        <div class="max-w-6xl mx-auto px-6 py-5 flex items-center justify-between">
            <a href="index.html"
                class="font-montserrat text-sm font-[600] text-gray-400 hover:text-white transition-colors duration-300 flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                Back to Family Page
            </a>
            <div class="font-montserrat text-lg font-[800] uppercase tracking-wider text-white">
                Kris <span class="text-gray-500">Garcia</span>
            </div>
        </div>
    </header>

    <!-- 1. Two-Column Hero Section -->
    <section class="py-24 md:py-36 bg-gradient-to-b from-brandDark to-brandCard border-b border-gray-800">
        <div class="max-w-6xl mx-auto px-6 grid grid-cols-1 lg:grid-cols-2 gap-16 lg:gap-12 items-center">

            <!-- Column 1: Profile Info -->
            <div class="text-center lg:text-left flex flex-col items-center lg:items-start">
                <h2
                    class="font-montserrat text-2xl md:text-3xl font-[700] text-gray-100 tracking-tight max-w-md leading-relaxed">
                    Hi!<span class="inline-block animate-bounce ml-1">😍</span>
                </h2>
                <div
                    class="w-44 h-44 rounded-full bg-gray-800 border-4 border-gray-700 flex items-center justify-center text-gray-600 shadow-xl mb-8 overflow-hidden mb-2">
                    <!-- Profile Placeholder Icon -->
                    <!-- <svg class="w-16 h-16 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                        xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                    </svg> -->
                    <img src="https://ramvl.wordpress.com/wp-content/uploads/2026/06/kris.jpg" />
                </div>
                <h1
                    class="font-montserrat text-2xl md:text-3xl font-[700] text-gray-100 tracking-tight max-w-md leading-relaxed">
                    I’m Kris, I like cooking and scrolling
                    Tiktok. Find out more about me on this page.
                </h1>
            </div>

            <!-- Column 2: Dynamic Gallery (3 Small Top, 1 Large Main Layout) -->
            <div class="flex flex-col gap-4">
                <!-- Top Row (3 Mini Items) -->
                <div class="grid grid-cols-3 gap-4">
                    <div
                        class="overflow-hidden aspect-square rounded-lg bg-gray-800 border border-gray-700 flex items-center justify-center text-xs text-gray-500 font-mono shadow-sm">
                        <img src="https://ramvl.wordpress.com/wp-content/uploads/2026/06/feat1.jpg" alt="Gallery image 1" class="w-full h-full object-cover" />
                    </div>
                    <div
                        class="overflow-hidden aspect-square rounded-lg bg-gray-800 border border-gray-700 flex items-center justify-center text-xs text-gray-500 font-mono shadow-sm">
                        <img src="https://ramvl.wordpress.com/wp-content/uploads/2026/06/feat2.jpg" alt="Gallery image 2" class="w-full h-full object-cover" />
                    </div>
                    <div
                        class="overflow-hidden aspect-square rounded-lg bg-gray-800 border border-gray-700 flex items-center justify-center text-xs text-gray-500 font-mono shadow-sm">
                        <img src="https://ramvl.wordpress.com/wp-content/uploads/2026/06/feat3.jpg" alt="Gallery image 3" class="w-full h-full object-cover" />
                    </div>
                </div>
                <!-- Highlight Base Item -->
                <div
                    class="overflow-hidden h-64 sm:h-80 md:h-96 w-full rounded-lg bg-gray-800/60 border border-gray-700 flex items-center justify-center text-sm text-gray-400 font-mono shadow-md">
                    <img src="https://ramvl.wordpress.com/wp-content/uploads/2026/06/feat4-edited.jpg" alt="Gallery highlight image" class="w-full h-full object-cover" />
                </div>
            </div>

        </div>
    </section>

    <!-- 2. Designation Section -->
    <section class="py-32 md:py-40 max-w-4xl mx-auto px-6 text-center">
        <div
            class="bg-brandDark border border-gray-800 rounded-xl p-10 md:p-16 shadow-2xl relative overflow-hidden group">
            <div
                class="absolute -inset-px bg-gradient-to-r from-gray-800/10 via-transparent to-gray-800/10 opacity-50 pointer-events-none">
            </div>

            <div class="space-y-8 relative z-10">
                <div>
                    <!-- <span class="text-xs uppercase tracking-widest font-mono text-gray-500 block mb-2">Role
                        Profile</span> -->
                    <h2 class="font-montserrat text-2xl md:text-4xl font-[800] text-white tracking-tight leading-none">
                        RamNation's Creative Director<span
                            class="inline-block ml-2 group-hover:rotate-12 transition-transform duration-300">😆</span>
                    </h2>
                </div>

                <div class="w-12 h-[1px] bg-gray-800 mx-auto"></div>

                <div>
                    <h3 class="font-montserrat text-xl md:text-2xl font-[700] text-gray-300 tracking-wide uppercase">
                        Design Monster <span class="inline-block ml-1">👹</span>
                    </h3>
                </div>

                <div class="w-12 h-[1px] bg-gray-800 mx-auto"></div>

                <div>
                    <p class="text-base md:text-lg font-[500] text-gray-400 italic">
                        Tiktoks number one audience <span class="not-italic ml-1">😎</span>
                    </p>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer Space -->
    <footer class="bg-[#070a12] py-10 border-t border-gray-900 text-center text-xs text-gray-600">
        <div class="max-w-6xl mx-auto px-6">
            <p>&copy; 2026 Kris Garcia Portfolio. Part of the A. Garcia Scrapbook.</p>
        </div>
    </footer>

</body>

</html>
