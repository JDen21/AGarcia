<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Project & Task Manager</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            dark: '#090d16',
            card: '#111827',
            border: '#1f2937'
          }
        }
      }
    }
  </script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    /* Magic UI Glow and Glassmorphic Effects */
    .magic-glow {
      position: relative;
    }
    .magic-glow::before {
      content: '';
      position: absolute;
      inset: -1px;
      background: linear-gradient(90deg, #6366f1, #a855f7, #ec4899);
      border-radius: inherit;
      z-index: -1;
      opacity: 0.15;
      transition: opacity 0.3s ease;
    }
    .magic-glow:hover::before {
      opacity: 0.4;
    }
    .glass-panel {
      background: rgba(17, 24, 39, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #090d16;
    }
    ::-webkit-scrollbar-thumb {
      background: #374151;
      border-radius: 3px;
    }
  </style>
</head>
<body class="bg-dark text-slate-100 min-h-screen font-sans antialiased flex flex-col md:flex-row">

  <!-- Sidebar (Projects Navigation) -->
  <aside class="w-full md:w-80 border-b md:border-b-0 md:border-r border-slate-800/80 glass-panel p-4 md:p-6 flex flex-col flex-shrink-0">
    <!-- Header -->
    <div class="flex items-center space-x-3 mb-6">
      <div class="p-2 bg-indigo-600/20 text-indigo-400 rounded-xl border border-indigo-500/30">
        <i data-lucide="folder-kanban" class="w-6 h-6"></i>
      </div>
      <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-pink-400">
        Project Tracker
      </h1>
    </div>

    <!-- Create Project Form -->
    <div class="mb-6">
      <form id="project-form" class="flex items-center gap-2">
        <input 
          type="text" 
          id="project-name-input" 
          placeholder="New project name..." 
          required 
          class="w-full bg-slate-900 border border-slate-800 text-sm rounded-lg px-3 py-2 text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-colors"
        />
        <button 
          type="submit" 
          class="bg-indigo-600 hover:bg-indigo-500 text-white p-2 rounded-lg transition-colors flex-shrink-0"
          title="Add Project"
        >
          <i data-lucide="plus" class="w-4 h-4"></i>
        </button>
      </form>
    </div>

    <!-- Projects List Header -->
    <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-3 px-1">
      Projects
    </div>

    <!-- Projects List -->
    <div id="projects-list" class="space-y-1.5 overflow-y-auto flex-1 max-h-[250px] md:max-h-none">
      <!-- Dynamic Project Items inserted here -->
    </div>
  </aside>

  <!-- Main Content Area -->
  <main class="flex-1 p-4 md:p-8 overflow-y-auto">
    <div id="active-project-container" class="max-w-6xl mx-auto space-y-6">
      
      <!-- Project Title Banner & Actions -->
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-6 border-b border-slate-800">
        <div>
          <span class="text-xs font-medium text-indigo-400 tracking-wider uppercase">Active Project</span>
          <h2 id="active-project-title" class="text-2xl md:text-3xl font-bold text-white mt-1">Select a Project</h2>
        </div>
        
        <div class="flex items-center gap-3">
          <!-- Sync Indicator & Manual Sync Button -->
          <button 
            id="sync-btn" 
            class="bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 px-3.5 py-2.5 rounded-xl font-medium text-sm flex items-center gap-2 transition-colors"
            title="Sync with Google Sheets"
          >
            <i id="sync-icon" data-lucide="refresh-cw" class="w-4 h-4"></i>
            <span id="sync-status">Synced</span>
          </button>

          <button 
            id="open-task-modal-btn" 
            class="hidden magic-glow bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white px-4 py-2.5 rounded-xl font-medium text-sm flex items-center justify-center gap-2 shadow-lg shadow-indigo-500/20 transition-all"
          >
            <i data-lucide="plus-circle" class="w-4 h-4"></i>
            <span>Add New Task</span>
          </button>
        </div>
      </div>

      <!-- Warning/Error Notification Banner -->
      <div id="alert-banner" class="hidden p-4 rounded-xl bg-amber-500/10 border border-amber-500/30 text-amber-300 text-sm flex items-center gap-3">
        <i data-lucide="alert-triangle" class="w-5 h-5 flex-shrink-0"></i>
        <span id="alert-message">Cannot complete task with unfinished subtasks.</span>
      </div>

      <!-- Tasks Grid/Container -->
      <div id="tasks-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <!-- Task cards dynamically rendered here -->
      </div>

    </div>
  </main>

  <!-- New Task Modal -->
  <div id="task-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-card border border-slate-800 rounded-2xl w-full max-w-lg p-6 shadow-2xl relative magic-glow">
      <div class="flex items-center justify-between pb-4 mb-4 border-b border-slate-800">
        <h3 class="text-lg font-bold text-white">Create New Task</h3>
        <button id="close-modal-btn" class="text-slate-400 hover:text-white p-1">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="task-form" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Task Title</label>
          <input 
            type="text" 
            id="task-title-input" 
            required 
            placeholder="e.g. Design Wireframes" 
            class="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-slate-200 text-sm focus:outline-none focus:border-indigo-500"
          />
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Initial Status</label>
          <select 
            id="task-status-input" 
            class="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-slate-200 text-sm focus:outline-none focus:border-indigo-500"
          >
            <option value="queue">Queue</option>
            <option value="on_going">On Going</option>
            <option value="on_hold">On Hold</option>
            <option value="done">Done</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </div>

        <div class="flex justify-end gap-3 pt-4 border-t border-slate-800">
          <button 
            type="button" 
            id="cancel-modal-btn" 
            class="px-4 py-2 text-sm font-medium text-slate-400 hover:text-white rounded-lg transition-colors"
          >
            Cancel
          </button>
          <button 
            type="submit" 
            class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-500 rounded-lg transition-colors"
          >
            Create Task
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- JavaScript Application Logic -->
  <script>
    // Google Apps Script Hooked Endpoint URL
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyS9WMZ6_ud9lmZuvHZMBGtR0lsya1ZV18y0vsP62IERxhhLl6IWd4YM6ukOddXWj8/exec";

    // App State
    let state = {
      projects: [],
      activeProjectId: null,
      tasks: []
    };

    // DOM Elements
    const projectsListEl = document.getElementById('projects-list');
    const projectFormEl = document.getElementById('project-form');
    const projectNameInputEl = document.getElementById('project-name-input');
    const activeProjectTitleEl = document.getElementById('active-project-title');
    const openTaskModalBtn = document.getElementById('open-task-modal-btn');
    const tasksContainerEl = document.getElementById('tasks-container');
    const taskModalEl = document.getElementById('task-modal');
    const closeModalBtn = document.getElementById('close-modal-btn');
    const cancelModalBtn = document.getElementById('cancel-modal-btn');
    const taskFormEl = document.getElementById('task-form');
    const taskTitleInputEl = document.getElementById('task-title-input');
    const taskStatusInputEl = document.getElementById('task-status-input');
    const alertBannerEl = document.getElementById('alert-banner');
    const alertMessageEl = document.getElementById('alert-message');
    const syncBtn = document.getElementById('sync-btn');
    const syncStatusEl = document.getElementById('sync-status');
    const syncIconEl = document.getElementById('sync-icon');

    // Status Config
    const STATUS_CONFIG = {
      queue: { label: 'Queue', bg: 'bg-slate-500/10', text: 'text-slate-400', border: 'border-slate-500/20' },
      on_going: { label: 'On Going', bg: 'bg-blue-500/10', text: 'text-blue-400', border: 'border-blue-500/20' },
      on_hold: { label: 'On Hold', bg: 'bg-amber-500/10', text: 'text-amber-400', border: 'border-amber-500/20' },
      done: { label: 'Done', bg: 'bg-emerald-500/10', text: 'text-emerald-400', border: 'border-emerald-500/20' },
      cancelled: { label: 'Cancelled', bg: 'bg-rose-500/10', text: 'text-rose-400', border: 'border-rose-500/20' }
    };

    // Initialize App & Fetch Data from Google Sheets
    async function init() {
      setupEventListeners();
      await fetchFromGoogleSheets();
      lucide.createIcons();
    }

    // Read Data from Google Sheets
    async function fetchFromGoogleSheets() {
      setSyncState("Syncing...", true);
      try {
        const res = await fetch(GOOGLE_SCRIPT_URL);
        const data = await res.json();

        if (data.projects && Array.isArray(data.projects)) {
          state.projects = data.projects;
        }
        if (data.tasks && Array.isArray(data.tasks)) {
          state.tasks = data.tasks.map(t => ({
            ...t,
            subtasks: t.subtasks || []
          }));
        }

        if (state.projects.length > 0 && !state.activeProjectId) {
          state.activeProjectId = state.projects[0].id;
        }

        renderProjects();
        renderActiveProject();
        setSyncState("Synced", false);
      } catch (err) {
        console.error("Fetch Error:", err);
        setSyncState("Sync Error", false);
        showAlert("Failed to connect to Google Sheets. Please check your Script URL permissions.");
      }
    }

    // Save Data to Google Sheets
    async function saveToGoogleSheets() {
      setSyncState("Saving...", true);
      try {
        const payload = {
          type: "SAVE_ALL",
          projects: state.projects,
          tasks: state.tasks
        };

        const res = await fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify(payload)
        });

        const result = await res.json();
        if (result.status === "success") {
          setSyncState("Synced", false);
        } else {
          throw new Error(result.message || "Unknown error");
        }
      } catch (err) {
        console.error("Save Error:", err);
        setSyncState("Sync Error", false);
        showAlert("Error saving data to Google Sheets.");
      }
    }

    function setSyncState(label, isSpinning) {
      syncStatusEl.textContent = label;
      if (isSpinning) {
        syncIconEl.classList.add("animate-spin");
      } else {
        syncIconEl.classList.remove("animate-spin");
      }
    }

    // Render Projects List
    function renderProjects() {
      projectsListEl.innerHTML = '';
      state.projects.forEach(project => {
        const isActive = project.id === state.activeProjectId;
        const button = document.createElement('button');
        button.className = `w-full text-left px-3 py-2.5 rounded-xl text-sm font-medium transition-all flex items-center justify-between group ${
          isActive 
            ? 'bg-indigo-600/15 text-indigo-300 border border-indigo-500/30' 
            : 'text-slate-400 hover:bg-slate-800/50 hover:text-slate-200'
        }`;
        
        button.innerHTML = `
          <div class="flex items-center gap-2.5 truncate">
            <i data-lucide="folder" class="w-4 h-4 ${isActive ? 'text-indigo-400' : 'text-slate-500'}"></i>
            <span class="truncate">${escapeHtml(project.name)}</span>
          </div>
          <button 
            data-delete-project="${project.id}" 
            class="opacity-0 group-hover:opacity-100 text-slate-500 hover:text-rose-400 p-1 rounded transition-opacity"
            title="Delete Project"
          >
            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
          </button>
        `;

        button.addEventListener('click', (e) => {
          if (e.target.closest('[data-delete-project]')) {
            e.stopPropagation();
            deleteProject(project.id);
          } else {
            state.activeProjectId = project.id;
            renderProjects();
            renderActiveProject();
          }
        });

        projectsListEl.appendChild(button);
      });
      lucide.createIcons();
    }

    // Render Active Project Tasks
    function renderActiveProject() {
      const activeProject = state.projects.find(p => p.id === state.activeProjectId);
      
      if (!activeProject) {
        activeProjectTitleEl.textContent = 'No Project Selected';
        openTaskModalBtn.classList.add('hidden');
        tasksContainerEl.innerHTML = '<div class="col-span-full text-slate-500 text-center py-12">Create or select a project to manage tasks.</div>';
        return;
      }

      activeProjectTitleEl.textContent = activeProject.name;
      openTaskModalBtn.classList.remove('hidden');

      const projectTasks = state.tasks.filter(t => t.projectId === activeProject.id);
      
      if (projectTasks.length === 0) {
        tasksContainerEl.innerHTML = `
          <div class="col-span-full glass-panel border border-dashed border-slate-800 rounded-2xl p-12 text-center text-slate-500">
            <i data-lucide="check-square" class="w-10 h-10 mx-auto mb-3 opacity-40"></i>
            <p class="font-medium text-slate-400">No tasks in this project</p>
            <p class="text-xs text-slate-600 mt-1">Click "Add New Task" above to get started.</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      tasksContainerEl.innerHTML = '';
      projectTasks.forEach(task => {
        const card = createTaskCard(task);
        tasksContainerEl.appendChild(card);
      });

      lucide.createIcons();
    }

    // Create Task Card Element
    function createTaskCard(task) {
      const card = document.createElement('div');
      card.className = 'glass-panel border border-slate-800/80 rounded-2xl p-5 flex flex-col justify-between magic-glow space-y-4';

      const config = STATUS_CONFIG[task.status] || STATUS_CONFIG.queue;
      const allSubtasksDone = task.subtasks.length === 0 || task.subtasks.every(st => st.completed);

      card.innerHTML = `
        <div class="space-y-3">
          <div class="flex items-start justify-between gap-2">
            <h4 class="font-semibold text-slate-100 text-base leading-snug">${escapeHtml(task.title)}</h4>
            <button 
              data-delete-task="${task.id}" 
              class="text-slate-500 hover:text-rose-400 p-1 rounded transition-colors"
              title="Delete Task"
            >
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
          </div>

          <div>
            <select 
              data-task-status-select="${task.id}" 
              class="text-xs font-semibold px-2.5 py-1 rounded-full border ${config.bg} ${config.text} ${config.border} focus:outline-none cursor-pointer"
            >
              <option value="queue" ${task.status === 'queue' ? 'selected' : ''}>Queue</option>
              <option value="on_going" ${task.status === 'on_going' ? 'selected' : ''}>On Going</option>
              <option value="on_hold" ${task.status === 'on_hold' ? 'selected' : ''}>On Hold</option>
              <option value="done" ${task.status === 'done' ? 'selected' : ''}>Done</option>
              <option value="cancelled" ${task.status === 'cancelled' ? 'selected' : ''}>Cancelled</option>
            </select>
          </div>
        </div>

        <div class="border-t border-slate-800/80 pt-3 space-y-2">
          <div class="flex items-center justify-between text-xs text-slate-400 font-medium">
            <span>Subtasks (${task.subtasks.filter(st => st.completed).length}/${task.subtasks.length})</span>
            ${!allSubtasksDone ? '<span class="text-amber-400 text-[10px]">Must complete all to set Done</span>' : ''}
          </div>

          <div class="space-y-1.5 max-h-40 overflow-y-auto">
            ${task.subtasks.map(st => `
              <div class="flex items-center justify-between bg-slate-900/60 border border-slate-800/50 rounded-lg px-2.5 py-1.5 text-xs">
                <label class="flex items-center gap-2 cursor-pointer flex-1 truncate pr-2">
                  <input 
                    type="checkbox" 
                    data-toggle-subtask="${st.id}" 
                    data-task-id="${task.id}"
                    ${st.completed ? 'checked' : ''} 
                    class="rounded border-slate-700 text-indigo-600 focus:ring-0 focus:ring-offset-0 bg-slate-950"
                  />
                  <span class="${st.completed ? 'line-through text-slate-500' : 'text-slate-300'} truncate">
                    ${escapeHtml(st.title)}
                  </span>
                </label>
                <button 
                  data-delete-subtask="${st.id}" 
                  data-task-id="${task.id}"
                  class="text-slate-600 hover:text-rose-400 transition-colors"
                >
                  <i data-lucide="x" class="w-3 h-3"></i>
                </button>
              </div>
            `).join('')}
          </div>

          <form data-add-subtask-form="${task.id}" class="flex items-center gap-1.5 pt-1">
            <input 
              type="text" 
              placeholder="Add subtask..." 
              required
              class="w-full bg-slate-900 border border-slate-800 rounded-lg px-2.5 py-1 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500"
            />
            <button 
              type="submit" 
              class="bg-slate-800 hover:bg-slate-700 text-slate-300 p-1 rounded-lg transition-colors"
              title="Add Subtask"
            >
              <i data-lucide="plus" class="w-3.5 h-3.5"></i>
            </button>
          </form>
        </div>
      `;

      // Status Change
      const statusSelect = card.querySelector(`[data-task-status-select="${task.id}"]`);
      statusSelect.addEventListener('change', (e) => {
        const nextStatus = e.target.value;
        if (nextStatus === 'done') {
          const hasUnfinishedSubtasks = task.subtasks.some(st => !st.completed);
          if (hasUnfinishedSubtasks) {
            showAlert(`Cannot set "${task.title}" to Done. All subtasks must be finished first.`);
            e.target.value = task.status;
            return;
          }
        }
        task.status = nextStatus;
        renderActiveProject();
        saveToGoogleSheets();
      });

      // Delete Task
      card.querySelector(`[data-delete-task="${task.id}"]`).addEventListener('click', () => {
        state.tasks = state.tasks.filter(t => t.id !== task.id);
        renderActiveProject();
        saveToGoogleSheets();
      });

      // Toggle Subtask
      card.querySelectorAll('[data-toggle-subtask]').forEach(chk => {
        chk.addEventListener('change', (e) => {
          const subtaskId = e.target.getAttribute('data-toggle-subtask');
          const subtask = task.subtasks.find(st => st.id === subtaskId);
          if (subtask) {
            subtask.completed = e.target.checked;
            if (!subtask.completed && task.status === 'done') {
              task.status = 'on_going';
              showAlert(`Task status changed from Done to On Going because a subtask was unchecked.`);
            }
            renderActiveProject();
            saveToGoogleSheets();
          }
        });
      });

      // Delete Subtask
      card.querySelectorAll('[data-delete-subtask]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const subtaskId = btn.getAttribute('data-delete-subtask');
          task.subtasks = task.subtasks.filter(st => st.id !== subtaskId);
          renderActiveProject();
          saveToGoogleSheets();
        });
      });

      // Add Subtask Form Submit
      const subtaskForm = card.querySelector(`[data-add-subtask-form="${task.id}"]`);
      subtaskForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const input = subtaskForm.querySelector('input');
        const title = input.value.trim();
        if (title) {
          task.subtasks.push({
            id: 'st_' + Date.now(),
            taskId: task.id,
            title: title,
            completed: false
          });
          if (task.status === 'done') {
            task.status = 'on_going';
            showAlert(`Task status changed to On Going due to new incomplete subtask.`);
          }
          renderActiveProject();
          saveToGoogleSheets();
        }
      });

      return card;
    }

    function showAlert(msg) {
      alertMessageEl.textContent = msg;
      alertBannerEl.classList.remove('hidden');
      setTimeout(() => {
        alertBannerEl.classList.add('hidden');
      }, 4000);
    }

    function deleteProject(projectId) {
      state.projects = state.projects.filter(p => p.id !== projectId);
      state.tasks = state.tasks.filter(t => t.projectId !== projectId);
      if (state.activeProjectId === projectId) {
        state.activeProjectId = state.projects.length > 0 ? state.projects[0].id : null;
      }
      renderProjects();
      renderActiveProject();
      saveToGoogleSheets();
    }

    function setupEventListeners() {
      // Manual Sync Button
      syncBtn.addEventListener('click', fetchFromGoogleSheets);

      // Add Project
      projectFormEl.addEventListener('submit', (e) => {
        e.preventDefault();
        const name = projectNameInputEl.value.trim();
        if (name) {
          const newProject = { id: 'p_' + Date.now(), name: name };
          state.projects.push(newProject);
          state.activeProjectId = newProject.id;
          projectNameInputEl.value = '';
          renderProjects();
          renderActiveProject();
          saveToGoogleSheets();
        }
      });

      // Modal Controls
      openTaskModalBtn.addEventListener('click', () => taskModalEl.classList.remove('hidden'));
      closeModalBtn.addEventListener('click', () => taskModalEl.classList.add('hidden'));
      cancelModalBtn.addEventListener('click', () => taskModalEl.classList.add('hidden'));

      // Add Task
      taskFormEl.addEventListener('submit', (e) => {
        e.preventDefault();
        const title = taskTitleInputEl.value.trim();
        const status = taskStatusInputEl.value;

        if (title && state.activeProjectId) {
          const newTask = {
            id: 't_' + Date.now(),
            projectId: state.activeProjectId,
            title: title,
            status: status,
            subtasks: []
          };
          state.tasks.push(newTask);
          taskTitleInputEl.value = '';
          taskStatusInputEl.value = 'queue';
          taskModalEl.classList.add('hidden');
          renderActiveProject();
          saveToGoogleSheets();
        }
      });
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, function(m) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        }[m];
      });
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
